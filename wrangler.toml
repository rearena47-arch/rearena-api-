# ── Re Arena — Cloudflare Worker Configuration ────────────────────────────────

name            = "re-arena-api"
main            = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Environment Variables (non-secret) ───────────────────────────────────────
[vars]
FIREBASE_DATABASE_URL = "https://re-arena-final-default-rtdb.firebaseio.com"
FIREBASE_PROJECT_ID   = "re-arena-final"
ALLOWED_ORIGINS       = "*"

# ── KV Namespace ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "FCM_KV"
id         = "8ff93c44425d48cd971ca4e9b3a22701"
preview_id = "8ff93c44425d48cd971ca4e9b3a22701"

# ── Cron Triggers ─────────────────────────────────────────────────────────────
[triggers]
crons = [
  "* * * * *",
  "*/5 * * * *",
  "0 0 * * *",
]

# ── Observability ─────────────────────────────────────────────────────────────
[observability]
enabled = true

# ── Build ─────────────────────────────────────────────────────────────────────
[build]
command = ""
